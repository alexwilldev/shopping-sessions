[package]
name = "shopsess"
version = "0.1.0"
edition = "2024"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
debug = false

[dependencies]
libc = "0.2.191"
memchr = "2.8.3"
memmap2 = "0.9.12"
mimalloc = "0.1.52"
parquet = { version = "60.1.0", default-features = false }
rayon = "1.12.0"
rustc-hash = "2.1.3"
